name: Build Android TWA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap Non-Interactive
        run: |
          mkdir -p \~/.bubblewrap
          cat > \~/.bubblewrap/config.json << EOL
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOL
          echo "=== Bubblewrap Config ==="
          cat \~/.bubblewrap/config.json
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Generate Keystore and Patch Manifest
        working-directory: twa
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Daftary, OU=Dev, O=Daftary, L=Cairo, ST=Cairo, C=EG"
          node -e '
            const fs = require("fs");
            const path = "twa-manifest.json";
            if (fs.existsSync(path)) {
              const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
              manifest.keyStore = { path: "android.keystore", alias: "android" };
              fs.writeFileSync(path, JSON.stringify(manifest, null, 2));
            }
          '

      - name: Build TWA APK
        working-directory: twa
        run: |
          echo "n" | bubblewrap build --skipPwaValidation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daftary-apk
          path: twa/*.apk
