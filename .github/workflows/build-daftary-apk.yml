name: Build Daftary Signed APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Write local.properties
        working-directory: android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Decode keystore
        working-directory: android
        run: echo "${{ secrets.DAFTARY_KEYSTORE_BASE64 }}" | base64 -d > my-release-key.keystore

      - name: Align APK
        working-directory: android
        run: |
          BUILD_TOOLS=$ANDROID_SDK_ROOT/build-tools/34.0.0
          $BUILD_TOOLS/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk Daftary-aligned.apk

      - name: Sign APK
        working-directory: android
        run: |
          BUILD_TOOLS=$ANDROID_SDK_ROOT/build-tools/34.0.0
          $BUILD_TOOLS/apksigner sign --ks my-release-key.keystore --ks-key-alias daftary_key --ks-pass pass:${{ secrets.DAFTARY_KS_PASS }} --key-pass pass:${{ secrets.DAFTARY_KEY_PASS }} --out Daftary-Final.apk Daftary-aligned.apk

      - name: Clean up keystore from workspace
        working-directory: android
        run: rm -f my-release-key.keystore

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Daftary-Final
          path: android/Daftary-Final.apk
